<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chameleon — Adaptive Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="chameleon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="aurora"><i></i><i></i><i></i></div>
  <div id="shell">
    <header id="topbar">
      <div id="brand">
        <div id="brand-mark"><img src="chameleon.png" alt="Chameleon"></div>
      </div>
      <div id="ctxbar"></div>
      <div id="usecases" aria-label="suggested moves"></div>
      <div id="appsmenu">
        <button id="apps-btn" title="All tools">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2.5" y="2.5" width="4.2" height="4.2" rx="1.2"/><rect x="9.3" y="2.5" width="4.2" height="4.2" rx="1.2"/><rect x="2.5" y="9.3" width="4.2" height="4.2" rx="1.2"/><rect x="9.3" y="9.3" width="4.2" height="4.2" rx="1.2"/></svg>
        </button>
        <div id="apps-pop"></div>
      </div>
    </header>

    <main id="stage">
      <section id="workspace">
        <div id="canvas"></div>
      </section>

      <aside id="chatpane">
        <div id="chat-drag" title="Drag to resize"></div>
        <div id="chat-head">
          <span class="ch-dot"></span>
          <b>Chameleon</b>
          <span id="chat-grip" title="Drag me — edges dock, bottom-right corner minimizes, anywhere else floats">
            <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="5.5" cy="4" r="1.2"/><circle cx="10.5" cy="4" r="1.2"/><circle cx="5.5" cy="8" r="1.2"/><circle cx="10.5" cy="8" r="1.2"/><circle cx="5.5" cy="12" r="1.2"/><circle cx="10.5" cy="12" r="1.2"/></svg>
          </span>
        </div>
        <div id="chat-hero">
          <img class="hero-glyph" src="chameleon.png" alt="">
          <h1>Where should we start?</h1>
          <p>Five accounts. Nine live deals. I open, resize and clear tools as the conversation moves — the workspace is ours to shape.</p>
        </div>
        <div id="chat-log"></div>
        <div id="suggestions"></div>
        <form id="chat-form" autocomplete="off">
          <input id="chat-input" placeholder="Ask for anything…" maxlength="500">
          <button id="chat-send" type="submit" aria-label="send">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2L7.5 8.5M14 2l-4.2 12-2.3-5.5L2 6.2z"/></svg>
          </button>
        </form>
      </aside>
    </main>
  </div>

  <script src="layout.js"></script>
  <script src="apps.js"></script>
  <script src="app.js"></script>
</body>
</html>
