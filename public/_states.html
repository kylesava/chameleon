<!doctype html>
<html><head><meta charset="utf-8">
<title>state matrix</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; }
  #grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  .cell { width: 430px; }
  .cap { font: 600 9px 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 1px; color: #7a8698; margin-bottom: 5px; }
  .tile { position: relative !important; left: 0 !important; top: 0 !important; width: 430px; height: 330px; }
</style>
</head>
<body>
<div id="grid"></div>
<script src="richtext.js"></script>
<script src="apps.js"></script>
<script>
/* Every app in every state, side by side — the fastest way to spot the small
   visual breakages that only show up in one combination. */
const PLAN = { id: 7, title: 'How GPS works', tasks: [
  { id: 1, stage: 0, title: 'Get the core trick: distance = speed of light × travel time', detail: 'Satellites broadcast a timestamped signal', status: 'done' },
  { id: 2, stage: 0, title: 'Explain trilateration in your own words', detail: 'Why 3 spheres pin you to a point', status: 'doing' },
  { id: 3, stage: 1, title: 'Say why a 4th satellite is needed', detail: '', status: 'todo' },
  { id: 4, stage: 1, title: 'A goal with a deliberately very long title that should wrap gracefully and not blow out the tile', detail: 'and a long detail line underneath it as well to check wrapping', status: 'todo' },
]};
const SOURCES = [
  { id: 1, kind: 'text', title: 'My lecture notes', content: 'The mitochondrion is the powerhouse of the cell and a great many other words follow here to test truncation behaviour in the list row.' },
  { id: 2, kind: 'url', title: 'A very long page title that will certainly need truncating in the row', content: 'https://example.com/x\n\nbody text' },
  { id: 3, kind: 'note', title: 'Key idea', content: 'Electrons pay for a proton battery.' },
];
const LESSON = { id: 10, app: 'lesson', title: 'Rich', data: { title: 'Everything at once', sections: [
  { heading: 'Prose, marks and a table', body: 'Normal text with **bold**, *italic*, `code`, ~~strike~~ and ==highlight==, plus a [link](https://example.com).\n\n| Layer | Job | Note |\n|:--|--:|---|\n| L1 | routes | a |\n| L2 | switches | b |' },
  { heading: 'Callouts', body: '> [!KEY] The one idea\n> Electrons never touch ATP.\n\n> [!WARNING] The classic mistake\n> Leaving the door open does not cool the room.\n\n> [!TIP]\n> Short one.\n\n> plain quote here' },
  { heading: 'Maths and code', body: 'Inline $E = mc^2$ and display:\n\n$$\\frac{1}{\\lambda^4}$$\n\n```js\nconst x = a < b && c;\n```' },
  { heading: 'A diagram', body: '```mermaid\ngraph LR\n  A[Client] -->|SYN| B[Server]\n  B -->|SYN+ACK| A\n  A -->|ACK| B\n```' },
  { heading: 'Task list', body: '- [x] done thing\n- [ ] open thing\n- normal bullet\n\n1. first\n2. second' },
]}};
const QUIZ = { id: 11, app: 'quiz', title: 'Q', data: { title: 'A check with a fairly long title to test wrapping', questions: [
  { type: 'mc', prompt: 'Short one?', choices: ['a', 'b', 'c'], answer_index: 1, explain: 'because b' },
  { type: 'mc', prompt: 'A much longer question that runs on to check how the prompt wraps inside the tile at small sizes?', choices: ['A fairly long answer option that must wrap too', 'short'], answer_index: 0, explain: 'x' },
  { type: 'free', prompt: 'Explain it in your own words.' },
]}};
const CARDS = { id: 12, app: 'flashcards', title: 'D', data: { title: 'Deck', cards: [
  { q: 'What does a GPS satellite broadcast?', a: 'Its position plus a precise timestamp.' },
  { q: 'A much longer question on a flashcard that needs to wrap nicely inside the flip card without overflowing?', a: 'And an answer that is also quite long indeed, wrapping across several lines.' },
]}};
const POD = { id: 13, app: 'podcast', title: 'P', data: { title: 'Episode', description: '2 hosts', lines: [
  { host: 'A', text: 'So the mitochondria is really a battery.' }, { host: 'B', text: 'Right, and ATP synthase is the motor.' },
]}};
const DECK = { id: 14, app: 'deck', title: 'Deck', data: { title: 'A deck', subtitle: 'sub', slides: [
  { layout: 'title', title: 'How Vaccines Train the Immune System', subtitle: 'A fire drill for your body', notes: 'open warm' },
  { layout: 'bullets', title: 'Bullets', bullets: ['First point', 'A considerably longer bullet point that will need to wrap on to a second line'], notes: 'n' },
  { layout: 'quote', quote: 'A vaccine does not fight the disease. It hands your body the wanted poster.', attribution: 'the point', notes: 'n' },
  { layout: 'split', title: 'Split', left: '**Left**\n\n- one\n- two', right: '**Right**\n\n| a | b |\n|---|---|\n| 1 | 2 |', notes: 'n' },
]}};

const ART = { lesson: LESSON, quiz: QUIZ, flashcards: CARDS, podcast: POD, deck: DECK };
let DRAFT = null, PLANV = PLAN, SRC = SOURCES;
Apps.configure({
  getPlan: () => PLANV, getSources: () => SRC,
  currentArtifact: a => ART[a] || null,
  ttsEnabled: () => true, sessionId: () => 1,
  draftFor: a => (DRAFT && DRAFT.app === a ? DRAFT : null),
  api: async () => ({ ok: true }), planChanged: () => {}, sourceAdded: () => {}, sourceRemoved: () => {},
});

const grid = document.getElementById('grid');
function cell(label, appId, opts = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'cell';
  wrap.innerHTML = `<div class="cap">${label}</div>`;
  const t = document.createElement('div');
  t.className = 'tile';
  const spec = Apps.REGISTRY[appId];
  t.style.setProperty('--h', spec.hue);
  if (opts.h) t.style.height = opts.h + 'px';
  t.innerHTML = `<div class="tile-head"><span class="tile-ico">${Apps.icon(appId)}</span><span class="tile-name">${spec.name}</span><span class="tile-size">m</span><div class="tile-actions"><button class="tbtn close">×</button></div></div>${opts.status ? `<div class="tile-status"><i class="ts-dot"></i><span>${opts.status}</span></div>` : ''}<div class="tile-body"></div>`;
  wrap.appendChild(t);
  grid.appendChild(wrap);
  Apps.render(appId, t.querySelector('.tile-body'), { id: appId, ui: opts.ui || null });
  if (opts.narr) {
    const n = document.createElement('div');
    n.className = 'tile-narr';
    n.innerHTML = `<img src="chameleon.png" alt=""><span>${opts.narr}</span><button class="narr-x">×</button>`;
    t.appendChild(n);
  }
  return t;
}

// populated
cell('lesson · rich', 'lesson', { h: 620 });
cell('quiz · fresh', 'quiz', { h: 460 });
cell('quiz · submitted', 'quiz', { h: 460, ui: { artId: 11, answers: { 0: 0, 1: 0, 2: 'my answer' }, submitted: { score: 0.5, mc: 2, mcRight: 1, results: [ { type: 'mc', correct: false, answer_index: 1, explain: 'because b' }, { type: 'mc', correct: true, answer_index: 0, explain: 'x' }, { type: 'free' } ] } } });
cell('plan · live goal', 'plan', { h: 400, narr: "Here's our route — first the mindset shift." });
cell('plan · tiny (compact)', 'plan', { h: 170 });
cell('sources', 'sources', { h: 300 });
cell('flashcards', 'flashcards', { h: 330 });
cell('flashcards · flipped', 'flashcards', { ui: { artId: 12, idx: 1, flip: true, got: {}, round: 1 }, h: 330 });
cell('flashcards · cleared', 'flashcards', { ui: { artId: 12, idx: 0, flip: false, got: { 0: true, 1: true }, round: 2 }, h: 330 });
cell('podcast', 'podcast', { h: 330 });
cell('deck · title', 'deck', { h: 420 });
cell('deck · bullets', 'deck', { ui: { artId: 14, i: 1, notes: true }, h: 420 });
cell('deck · quote', 'deck', { ui: { artId: 14, i: 2, notes: false }, h: 420 });
cell('deck · split', 'deck', { ui: { artId: 14, i: 3, notes: true }, h: 420 });

// empty states
const savedPlan = PLANV, savedSrc = SRC;
PLANV = null; SRC = [];
for (const k of Object.keys(ART)) { ART[k] = null; }
cell('EMPTY plan', 'plan', { h: 190 });
cell('EMPTY sources', 'sources', { h: 190 });
cell('EMPTY lesson', 'lesson', { h: 190 });
cell('EMPTY quiz', 'quiz', { h: 190 });
cell('EMPTY flashcards', 'flashcards', { h: 190 });
cell('EMPTY podcast', 'podcast', { h: 190 });
cell('EMPTY deck', 'deck', { h: 190 });
PLANV = savedPlan; SRC = savedSrc;

// drafting states
DRAFT = { app: 'lesson', field: 'sections', head: { title: 'Streaming in' }, items: [
  { heading: 'Done section', body: 'Complete **body** text.' },
  { heading: 'Being written', body: 'Air molecules are far smaller than the wavelength of light. When a light wave hits a', _partial: true },
]};
cell('DRAFT lesson', 'lesson', { h: 360, status: 'Writing the lesson…' });
DRAFT = { app: 'quiz', field: 'questions', head: { title: 'Check' }, items: [
  { type: 'mc', prompt: 'Complete question?', choices: ['a', 'b'] },
  { type: 'mc', prompt: 'Half-written ques', _partial: true },
]};
cell('DRAFT quiz', 'quiz', { h: 360, status: 'Writing your quiz…' });
DRAFT = { app: 'plan', field: 'tasks', head: { title: 'Goals' }, items: [ { title: 'First goal', detail: 'x' }, { title: 'Partial go', _partial: true } ] };
cell('DRAFT plan', 'plan', { h: 300, status: 'Mapping out your goals…' });
DRAFT = { app: 'deck', field: 'slides', head: { title: 'Deck' }, items: [ { layout: 'title', title: 'Opening' }, { layout: 'foc', _partial: true } ] };
cell('DRAFT deck', 'deck', { h: 300, status: 'Building your deck…' });
DRAFT = { app: 'flashcards', field: 'cards', head: { title: 'Deck' }, items: [ { q: 'Done card?', a: 'yes' }, { q: 'Half writt', _partial: true } ] };
cell('DRAFT flashcards', 'flashcards', { h: 300, status: 'Building the deck…' });
DRAFT = null;

// error / degraded
ART.lesson = { id: 20, app: 'lesson', title: 'x', data: { title: 'Degraded', sections: [
  { heading: 'Broken diagram', body: '```mermaid\nthis is not valid mermaid at all {{{\n```' },
  { heading: 'Broken chart', body: '```chart\n{not json}\n```' },
  { heading: 'Image with no key', body: '![a caption](gen:a dark corridor)' },
]}};
cell('DEGRADED lesson', 'lesson', { h: 520 });
</script>
</body></html>
